name: Build Release

# Publishes a GitHub Release whenever dependencies/version.txt is bumped on master.
# USB toolkits self-update from:
#   https://github.com/abyssalsoldier/Endpoint-toolkit/releases/latest/download/{version.txt,latest.zip,latest.sha256}

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Package and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VERSION=$(cat dependencies/version.txt | tr -d '[:space:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      - name: Check for existing release
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v${{ steps.version.outputs.version }} already exists - bump dependencies/version.txt to publish a new one."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create clean zip
        if: steps.exists.outputs.exists == 'false'
        run: |
          zip -r latest.zip . \
            -x ".git/*" \
            -x ".github/*" \
            -x ".claude/*" \
            -x ".gitignore" \
            -x ".gitattributes" \
            -x "README.md" \
            -x "*.key" \
            -x "build.ps1" \
            -x ".vscode/*" \
            -x "_builds/*"

      - name: Generate SHA-256 checksum
        if: steps.exists.outputs.exists == 'false'
        run: |
          sha256sum latest.zip | awk '{print $1}' > latest.sha256
          cp dependencies/version.txt version.txt
          echo "SHA-256: $(cat latest.sha256)"

      - name: Publish GitHub Release
        if: steps.exists.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "v${VERSION}" latest.zip latest.sha256 version.txt \
            --target "${{ github.sha }}" \
            --title "v${VERSION}" \
            --generate-notes \
            --latest
          echo "Published v${VERSION}"
