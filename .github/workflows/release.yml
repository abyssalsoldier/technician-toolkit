name: Build Release

# Publishes a GitHub Release whenever the toolkit version is bumped on master.
#   Core repo   : version = dependencies/version.txt
#   Client repo : version = client/version.txt (the client overlay, see CLIENT_GUIDE.md)
# Releases go to THIS repository (github.repository), so a client repo publishes to its own feed.
# USB toolkits self-update from <repo>/releases/latest/download/{version.txt,latest.zip,latest.sha256}
# (core default in dependencies/Core/ClientOverlay.ps1, client feed in client/branding.json UpdateBaseUrl).

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Package and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version and product name
        id: version
        run: |
          if [ -f client/version.txt ]; then
            VERSION=$(cat client/version.txt | tr -d '[:space:]')
            echo "Client build (core v$(cat dependencies/version.txt | tr -d '[:space:]'))"
          else
            VERSION=$(cat dependencies/version.txt | tr -d '[:space:]')
          fi
          NAME="Endpoint Toolkit"
          if [ -f client/branding.json ]; then
            NAME=$(jq -r '.ProductName // "Endpoint Toolkit"' client/branding.json)
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Building $NAME version: $VERSION"

      - name: Validate client overlay and core integrity
        if: hashFiles('client/**') != ''
        shell: pwsh
        run: ./tools/Test-ClientOverlay.ps1

      - name: Verify core manifest is current (core repo)
        if: hashFiles('client/**') == ''
        shell: pwsh
        run: |
          . ./dependencies/Agent/CoreIntegrity.ps1
          $r = Test-ToolkitCoreIntegrity -Root .
          if (-not $r.Ok) {
            Format-ToolkitIntegrityReport -Result $r | ForEach-Object { Write-Host $_ }
            Write-Error 'dependencies/core-manifest.json is out of date. Run .\build.ps1 -UpdateCoreManifest and commit it.'
          }

      - name: Check for existing release
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v${{ steps.version.outputs.version }} already exists - bump the version file to publish a new one."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create clean zip
        if: steps.exists.outputs.exists == 'false'
        # Repo-only exclusions mirror Get-ToolkitPayloadExcludes in dependencies/Core/ClientOverlay.ps1
        run: |
          zip -r latest.zip . \
            -x ".git/*" \
            -x ".github/*" \
            -x ".claude/*" \
            -x ".gitignore" \
            -x ".gitattributes" \
            -x "README.md" \
            -x "AGENTS.md" \
            -x "CLAUDE.md" \
            -x "CLIENT_GUIDE.md" \
            -x "Setup-Client.bat" \
            -x "tools/*" \
            -x "client.example/*" \
            -x "client/_removed/*" \
            -x "client/Data/*" \
            -x "*.key" \
            -x "build.ps1" \
            -x ".vscode/*" \
            -x "_builds/*"

      - name: Create client kit (core repo only)
        # Everything a client needs to set up a branded toolkit WITHOUT GitHub: the full core including
        # Setup-Client.bat, tools/, client.example/ and the guides. Clients download this, not latest.zip.
        if: steps.exists.outputs.exists == 'false' && hashFiles('client/**') == ''
        run: |
          zip -r client-kit.zip . \
            -x ".git/*" \
            -x ".claude/*" \
            -x ".vscode/*" \
            -x "_builds/*" \
            -x "*.key" \
            -x "latest.zip"

      - name: Generate SHA-256 checksum
        if: steps.exists.outputs.exists == 'false'
        run: |
          sha256sum latest.zip | awk '{print $1}' > latest.sha256
          echo "${{ steps.version.outputs.version }}" > version.txt
          echo "SHA-256: $(cat latest.sha256)"

      - name: Publish GitHub Release
        if: steps.exists.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ASSETS="latest.zip latest.sha256 version.txt"
          if [ -f client-kit.zip ]; then ASSETS="$ASSETS client-kit.zip"; fi
          gh release create "v${VERSION}" $ASSETS \
            --target "${{ github.sha }}" \
            --title "${{ steps.version.outputs.name }} v${VERSION}" \
            --generate-notes \
            --latest
          echo "Published v${VERSION}"
