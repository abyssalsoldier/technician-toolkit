name: Build Release

# Publishes a GitHub Release whenever the toolkit version is bumped on main (the release branch;
# day-to-day work happens on dev and publishes nothing). Client repos that still use master also publish.
# Every release also gets the ready-to-run exe (built on Windows by the 'exe' job).
#   Core repo   : version = dependencies/version.txt
#   Client repo : version = client/version.txt (the client overlay, see CLIENT_GUIDE.md)
# Releases go to THIS repository (github.repository), so a client repo publishes to its own feed.
# USB toolkits self-update from <repo>/releases/latest/download/{version.txt,latest.zip,latest.sha256}
# (core default in dependencies/Core/ClientOverlay.ps1, client feed in client/branding.json UpdateBaseUrl).

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Package and publish release
    # Only the release branch publishes (also when started by hand from the Actions tab)
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false   # publishing uses gh with GH_TOKEN; no token left in .git/config

      # Values read from repo files (version.txt, branding.json ProductName) are untrusted input: they reach
      # later steps only through env variables, never through expressions pasted inside a run: script.
      - name: Read version and product name
        id: version
        run: |
          if [ -f client/version.txt ]; then
            VERSION=$(cat client/version.txt | tr -d '[:space:]')
            echo "Client build (core v$(cat dependencies/version.txt | tr -d '[:space:]'))"
          else
            VERSION=$(cat dependencies/version.txt | tr -d '[:space:]')
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+(\.[0-9]+){1,3}$'; then
            echo "::error::Version '$VERSION' is not a version number (e.g. 1.2.3)."
            exit 1
          fi
          NAME="Endpoint Toolkit"
          if [ -f client/branding.json ]; then
            NAME=$(jq -r '.ProductName // "Endpoint Toolkit"' client/branding.json)
          fi
          # One line, no control characters (a newline would inject extra step outputs)
          NAME=$(printf '%s' "$NAME" | tr -d '[:cntrl:]' | cut -c1-100)
          [ -n "$NAME" ] || NAME="Endpoint Toolkit"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Building $NAME version: $VERSION"

      - name: Validate client overlay and core integrity
        if: hashFiles('client/**') != ''
        shell: pwsh
        run: ./tools/Test-ClientOverlay.ps1

      - name: Check the core is current (client repo)
        # A warning, not a failure: an urgent client fix can still ship on an older core
        if: hashFiles('client/**') != ''
        shell: pwsh
        continue-on-error: true
        run: |
          . ./dependencies/Core/ClientOverlay.ps1
          $feed = (Get-ToolkitCoreDefaults).UpdateBaseUrl
          $mine = (Get-Content dependencies/version.txt -Raw).Trim()
          try {
            $http = [System.Net.Http.HttpClient]::new(); $http.Timeout = [TimeSpan]::FromSeconds(30)
            $latest = $http.GetStringAsync("$feed/version.txt").GetAwaiter().GetResult().Trim()
          } catch { Write-Host "::warning::Could not read the latest core version from $feed ($($_.Exception.Message))."; exit 0 }
          if ([version]$mine -lt [version]$latest) {
            Write-Host "::warning::This release is built on core v$mine, but core v$latest is available. Merge the 'Update core' pull request into dev (or git merge upstream/main), then release again."
          } else { Write-Host "Core v$mine is the latest core." }

      - name: Verify core manifest is current (core repo)
        if: hashFiles('client/**') == ''
        shell: pwsh
        run: |
          . ./dependencies/Agent/CoreIntegrity.ps1
          $r = Test-ToolkitCoreIntegrity -Root .
          if (-not $r.Ok) {
            Format-ToolkitIntegrityReport -Result $r | ForEach-Object { Write-Host $_ }
            Write-Error 'dependencies/core-manifest.json is out of date. Run .\build.ps1 -UpdateCoreManifest and commit it.'
          }

      - name: Check for existing release
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v${VERSION}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v${VERSION} already exists - bump the version file to publish a new one."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create client kit
        # Core repo  : the full core (Setup-Client.bat, tools/, client.example/, guides) for setting up a
        #              branded toolkit without GitHub.
        # Client repo: the client's own pack, the same plus their client/ folder (locked modules included),
        #              built from exactly this release. Attached only when the repo is PRIVATE: the pack
        #              holds locked module code, which must never be in a public release.
        # Secrets never ship (secrets.dat is tied to one Windows user); secrets-names.json lists the names.
        # Runs before the next step removes locked modules from the checkout for latest.zip.
        if: steps.exists.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -d client ] && [ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" != "true" ]; then
            echo "::warning::client-kit.zip not attached: this repo is public and the pack contains your locked modules. Make the repo private to get your pack with every release."
            exit 0
          fi
          zip -r -q client-kit.zip . \
            -x ".git/*" \
            -x ".claude/*" \
            -x ".vscode/*" \
            -x "_builds/*" \
            -x "*.key" \
            -x "client/secrets.dat" \
            -x "client/secrets.pkg" \
            -x "client/_removed/*" \
            -x "client/Data/*" \
            -x "website/*"
          echo "client-kit.zip: $(unzip -l client-kit.zip | tail -1)"

      - name: Leave out locked client modules
        # latest.zip has no password (plain USB updates), so locked modules must not ship in it (as in build.ps1)
        if: steps.exists.outputs.exists == 'false' && hashFiles('client/**') != ''
        shell: pwsh
        run: |
          . ./dependencies/Core/ClientOverlay.ps1
          . ./dependencies/Agent/LockedPayload.ps1
          foreach ($m in Get-ToolkitLockedModuleInfo -Root (Get-Location).Path) {
            Remove-Item -LiteralPath $m.File -Force
            Write-Host "Left out locked module: $($m.Name)"
          }

      - name: Create clean zip
        if: steps.exists.outputs.exists == 'false'
        # Repo-only exclusions mirror Get-ToolkitPayloadExcludes in dependencies/Core/ClientOverlay.ps1
        run: |
          zip -r latest.zip . \
            -x ".git/*" \
            -x ".github/*" \
            -x ".claude/*" \
            -x ".gitignore" \
            -x ".gitattributes" \
            -x "README.md" \
            -x "AGENTS.md" \
            -x "CLAUDE.md" \
            -x "CLIENT_GUIDE.md" \
            -x "Setup-Client.bat" \
            -x "tools/*" \
            -x "client.example/*" \
            -x "client/_removed/*" \
            -x "client/Data/*" \
            -x "client/secrets.dat" \
            -x "client/secrets.pkg" \
            -x "client/secrets-names.json" \
            -x "*.key" \
            -x "build.ps1" \
            -x ".vscode/*" \
            -x "_builds/*" \
            -x "website/*" \
            -x "client-kit.zip"

      - name: Generate SHA-256 checksum
        if: steps.exists.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sha256sum latest.zip | awk '{print $1}' > latest.sha256
          echo "$VERSION" > version.txt
          echo "SHA-256: $(cat latest.sha256)"

      - name: Publish GitHub Release
        if: steps.exists.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          NAME: ${{ steps.version.outputs.name }}
        run: |
          ASSETS="latest.zip latest.sha256 version.txt"
          if [ -f client-kit.zip ]; then ASSETS="$ASSETS client-kit.zip"; fi
          gh release create "v${VERSION}" $ASSETS \
            --target "$GITHUB_SHA" \
            --title "$NAME v${VERSION}" \
            --generate-notes \
            --latest
          echo "Published v${VERSION}"

  exe:
    name: Attach the exe to the release
    # Runs for new and existing releases: an older release without an exe gets one
    needs: release
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Build the exe and attach it (unless the release already has one)
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          $tag = "v$env:VERSION"
          $assets = @(gh release view $tag --json assets --jq '.assets[].name')
          if ($LASTEXITCODE -ne 0) { Write-Host "No release $tag yet - nothing to attach."; exit 0 }
          if ($assets -like '*.exe') { Write-Host "$tag already has an exe."; exit 0 }
          # Outside the checkout, so nothing from this step ends up inside the exe
          $out = Join-Path $env:RUNNER_TEMP 'exe-out'
          & .\build.ps1 -SFX -OutputPath $out
          if ($LASTEXITCODE -ne 0) { throw "build.ps1 failed (exit $LASTEXITCODE)" }
          $exe = Get-ChildItem -LiteralPath $out -Filter '*.exe' | Select-Object -First 1
          if (-not $exe) { throw 'build.ps1 produced no exe' }
          gh release upload $tag $exe.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Uploading the exe failed' }
          Write-Host "Attached $($exe.Name) to $tag"
